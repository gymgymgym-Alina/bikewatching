<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bikewatching — Boston Bluebikes Traffic</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="map.css">
    <script type="module" src="map.js"></script>
</head>
<body>
    <header>
        <h1>🚲 Bikewatching</h1>
        <label for="time-slider">
            Filter by time:
            <input type="range" id="time-slider" min="-1" max="1440" value="-1">
            <time id="selected-time"></time>
            <em id="any-time">(any time)</em>
        </label>
    </header>

    <p class="intro">Bluebikes traffic across Boston and Cambridge in March 2024. Each circle is a station, sized by how many trips start or end there. Drag the slider to see how traffic shifts through the day.</p>

    <div id="map">
        <svg></svg>
    </div>

    <div class="legend">
        <span class="legend-title">Traffic flow</span>
        <div style="--departure-ratio: 1">More departures</div>
        <div style="--departure-ratio: 0.5">Balanced</div>
        <div style="--departure-ratio: 0">More arrivals</div>
    </div>
</body>
</html>
